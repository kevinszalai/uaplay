<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>UA Play — Plataforma de premios</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#00528F; --teal:#008091; --azul-osc:#002447; --cyan:#00C4DF; --rosa:#ff436e;
    --bg:#F2FAFB; --white:#ffffff; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--azul-osc);font-family:'Poppins',sans-serif;min-height:100vh;font-size:16px;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(.85);opacity:0;}70%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);}}
  @keyframes spin360{to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
  @keyframes bounceLand{0%{transform:scale(1);}30%{transform:scale(1.07);}55%{transform:scale(.97);}100%{transform:scale(1);}}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .topbar{background:linear-gradient(120deg,var(--azul-osc),var(--azul) 60%,var(--teal));color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .iso{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--rosa));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25);animation:floaty 3s ease-in-out infinite;}
  .brand span{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;}
  .tagline{font-size:11px;opacity:.75;margin-top:-4px;}
  .who{font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px;}
  .who a{color:#fff;text-decoration:underline;cursor:pointer;}
  nav{display:flex;gap:8px;align-items:center;}
  nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;}
  nav button.active{background:var(--rosa);border-color:var(--rosa);}
  main{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
  h1.hero{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.5px;color:var(--azul-osc);margin:10px 0 4px;animation:fadeInUp .4s ease both;}
  .sub{color:#4a6b80;margin:0 0 26px;font-size:16px;animation:fadeInUp .4s ease .05s both;}
  .card{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:0 8px 24px rgba(0,36,71,.08);margin-bottom:20px;animation:fadeInUp .4s ease both;}
  .card h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;margin:0 0 14px;color:var(--azul);display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:15px;font-weight:600;margin:12px 0 6px;color:var(--azul-osc);}
  input[type=text],input[type=number],input[type=email],input[type=password],input[type=datetime-local],select,textarea{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid #dfeef2;font-family:'Poppins',sans-serif;font-size:16px;background:#fbfeff;}
  textarea{min-height:110px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);border-color:var(--cyan);}
  .game-types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
  .game-type{border:2px solid #e3f1f4;border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:.15s;background:#fbfeff;}
  .game-type:hover{transform:translateY(-2px);}
  .game-type.sel{border-color:var(--rosa);background:#fff0f4;}
  .game-type .emoji{font-size:28px;display:block;margin-bottom:6px;}
  .game-type b{font-size:15px;}
  .mode-toggle{display:flex;gap:10px;margin-top:6px;}
  .mode-opt{flex:1;border:2px solid #e3f1f4;border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-size:15px;font-weight:600;background:#fbfeff;font-family:'Poppins',sans-serif;}
  .mode-opt.sel{border-color:var(--teal);background:#e9fbfb;color:var(--teal);}
  .row-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;background:#fbfeff;border:1px solid #e3f1f4;border-radius:10px;padding:8px;}
  .row-item input[type=text]{flex:2 1 140px;}
  .row-item input[type=number]{flex:1 1 70px;width:auto;}
  .row-item button.del{background:none;border:none;color:var(--rosa);font-size:18px;cursor:pointer;}
  .add-btn{background:none;border:2px dashed var(--cyan);color:var(--teal);padding:11px 16px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px;}
  .prob-bar{height:10px;border-radius:6px;background:#eef7f8;overflow:hidden;margin:10px 0 4px;display:flex;}
  .prob-bar div{height:100%;}
  .prob-msg{font-size:13px;font-weight:600;}
  .prob-ok{color:var(--teal);}
  .prob-bad{color:var(--rosa);}
  .cta{background:var(--rosa);color:#fff;border:none;padding:16px 26px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 16px rgba(255,67,110,.35);transition:transform .15s;}
  .cta:active{transform:scale(.96);}
  .cta:disabled{background:#c9d6dc;box-shadow:none;cursor:not-allowed;}
  .cta.ghost{background:transparent;color:var(--azul);border:2px solid var(--azul);box-shadow:none;}
  .campaign-list .item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:#fbfeff;border:1px solid #e3f1f4;margin-bottom:8px;}
  .item .meta{font-size:13.5px;color:#5b7c8f;}
  .badge{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;}
  .badge.active{background:#e2f7ee;color:#0a8f56;}
  .badge.ended{background:#fdeaea;color:var(--rosa);}
  .badge.draft{background:#eef1f5;color:#5b7c8f;}
  .link-box{display:flex;gap:8px;align-items:center;background:#f2fbfc;border:1px dashed var(--cyan);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;}
  .icon-btn{background:#fff;border:1px solid #dfeef2;border-radius:8px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;}
  .icon-btn:active{transform:scale(.92);}
  .more-menu{position:relative;}
  .more-menu summary{list-style:none;}
  .more-menu summary::-webkit-details-marker{display:none;}
  summary:not(.icon-btn){list-style:none;display:flex;align-items:center;gap:8px;}
  summary:not(.icon-btn)::-webkit-details-marker{display:none;}
  summary:not(.icon-btn)::after{content:'▸';font-size:13px;margin-left:auto;transition:transform .2s;flex-shrink:0;}
  details[open] > summary:not(.icon-btn)::after{transform:rotate(90deg);}
  .more-menu-panel{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e3f1f4;border-radius:12px;box-shadow:0 10px 24px rgba(0,36,71,.18);padding:6px;min-width:230px;z-index:20;display:flex;flex-direction:column;gap:2px;}
  .menu-item{background:none;border:none;text-align:left;padding:12px 12px;font-size:15px;border-radius:7px;cursor:pointer;color:var(--azul-osc);font-family:'Poppins',sans-serif;}
  .menu-item:hover{background:#f2fbfc;}
  .menu-item.danger{color:var(--rosa);}
  .menu-item:disabled{opacity:.4;cursor:default;}
  .menu-item:disabled:hover{background:none;}
  .public-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px;}
  .stage{position:relative;width:400px;height:400px;margin:24px auto;max-width:92vw;filter:drop-shadow(0 14px 30px rgba(0,36,71,.25));animation:idleWobble 3s ease-in-out infinite;}
  .stage.land{animation:bounceLand .5s ease;}
  canvas#wheel{width:400px;height:400px;max-width:92vw;}
  .pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:30px solid var(--rosa);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));z-index:5;animation:pointerWiggle 1.6s ease-in-out infinite;transform-origin:top center;}
  .scratch-wrap{position:relative;width:340px;height:210px;max-width:90vw;margin:20px auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(0,36,71,.15);animation:pop .4s ease both, breathe 2.6s ease-in-out infinite;}
  .scratch-under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-family:'Bebas Neue';font-size:22px;color:var(--azul);padding:10px;text-align:center;}
  #scratchCanvas{position:absolute;inset:0;cursor:grab;touch-action:none;background-size:200px 100%;background-image:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:shimmer 2.4s linear infinite;}
  .result{margin-top:16px;padding:20px;border-radius:16px;background:linear-gradient(135deg,var(--azul),var(--teal));color:#fff;max-width:320px;animation:pop .5s ease both;}
  .result h3{font-family:'Bebas Neue';font-size:28px;margin:6px 0;letter-spacing:.5px;}
  .field-question{margin-bottom:10px;}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}
  .empty{color:#6f92a3;font-size:13px;text-align:center;padding:20px 0;}
  .expired{color:var(--rosa);font-weight:700;}
  .spinner{width:34px;height:34px;border-radius:50%;border:4px solid #e3f1f4;border-top-color:var(--rosa);margin:18px auto;animation:spin360 .8s linear infinite;}
  .quiz-btn{animation:fadeInUp .35s ease both;}
  .quiz-btn:nth-child(2){animation-delay:.05s;}
  .quiz-btn:nth-child(3){animation-delay:.1s;}
  .quiz-btn:nth-child(4){animation-delay:.15s;}
  .quiz-card{max-width:460px;text-align:center;animation:pop .45s ease both;}
  .quiz-timer-wrap{height:6px;background:#eef1f5;border-radius:4px;overflow:hidden;margin-bottom:14px;}
  .quiz-timer-bar{height:100%;width:100%;background:var(--rosa);border-radius:4px;}
  .quiz-emoji{font-size:52px;margin-bottom:4px;animation:floaty 2.4s ease-in-out infinite;}
  .quiz-question{font-family:'Bebas Neue';font-size:30px;color:var(--azul);line-height:1.15;margin:0 0 20px;letter-spacing:.3px;}
  .quiz-btn{font-size:15.5px;padding:16px 20px;transition:transform .2s, background .2s, color .2s;}
  .quiz-btn.selected{background:var(--rosa)!important;color:#fff!important;border-color:var(--rosa)!important;transform:scale(.97);}
  .quiz-btn.correct{background:#0a8f56!important;color:#fff!important;border-color:#0a8f56!important;}
  .quiz-btn.wrong{background:var(--rosa)!important;color:#fff!important;border-color:var(--rosa)!important;transform:scale(.97);}
  .quiz-btn:disabled{cursor:default;opacity:.6;}
  .quiz-btn:disabled.selected{opacity:1;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 6px 16px rgba(255,67,110,.35);}50%{box-shadow:0 6px 28px rgba(255,67,110,.65);}}
  .invite{animation:pulseGlow 1.8s ease-in-out infinite;}
  @keyframes pointerWiggle{0%,100%{transform:translateX(-50%) rotate(0deg);}50%{transform:translateX(-50%) rotate(10deg);}}
  @keyframes idleWobble{0%,100%{transform:rotate(0deg);}50%{transform:rotate(1.4deg);}}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.018);}}
  @keyframes sparkleFade{0%{opacity:1;transform:translateY(0) scale(.8) rotate(0deg);}100%{opacity:0;transform:translateY(-24px) scale(1.3) rotate(25deg);}}
  .sparkle{position:absolute;font-size:14px;pointer-events:none;animation:sparkleFade .65s ease forwards;z-index:6;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,36,71,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:#fff;border-radius:20px;padding:26px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;animation:pop .3s ease both;}
  .modal-box h2{font-family:'Bebas Neue';font-size:26px;color:var(--azul);margin:0 0 6px;}
  .help-step{display:flex;gap:12px;margin:16px 0;align-items:flex-start;}
  .help-step .num{width:28px;height:28px;border-radius:50%;background:var(--rosa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .help-step p{margin:0;font-size:14px;color:#2c4a5c;line-height:1.4;}
  .step-hint{font-size:14px;color:#5b7c8f;margin:-6px 0 14px;line-height:1.45;}
  .result-overlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--azul-osc),var(--azul) 55%,var(--teal));display:flex;align-items:center;justify-content:center;z-index:90;padding:24px;text-align:center;animation:pop .4s ease both;}
  .result-big{color:#fff;max-width:440px;}
  .result-tag{font-size:14px;opacity:.85;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
  .result-big h2{font-family:'Bebas Neue';font-size:min(15vw,64px);margin:10px 0;line-height:1.05;word-break:break-word;}
  .result-big p{font-size:16px;margin:14px 0 26px;opacity:.95;}
  .result-big .cta{background:#fff;color:var(--azul);}

  @media (max-width: 640px){
    .topbar{padding:14px 16px;flex-direction:column;align-items:flex-start;}
    .who{order:3;}
    nav{width:100%;}
    nav button{flex:1;text-align:center;}
    main{padding:20px 14px 60px;}
    h1.hero{font-size:32px;}
    .card{padding:16px;}
    .game-types{grid-template-columns:1fr 1fr;}
    .game-types .game-type:nth-child(3){grid-column:span 2;}
    .mode-toggle{flex-direction:column;}
    .stage{width:300px;height:300px;}
    canvas#wheel{width:300px;height:300px;}
    .scratch-wrap{width:100%;max-width:280px;}
  }
  @media (max-width: 380px){
    .game-types{grid-template-columns:1fr;}
    .game-types .game-type:nth-child(3){grid-column:auto;}
  }
</style>
</head>

function isValidNotifyEmail(email){
  return (email||'').trim().toLowerCase().endsWith(NOTIFY_DOMAIN) && (email||'').includes('@');
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, gainStart, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(gainStart||0.12, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
const sound = {

  lose(){ beep(300, 0.3, 'sine', 0.1); beep(220, 0.35, 'sine', 0.08, 0.12); },

async function loadIdentity(){
  try{ const raw = localStorage.getItem('uaplay_identity'); me = raw ? JSON.parse(raw) : null; }
  catch(e){ me = null; }
}
async function saveIdentity(name){
  me = {creatorId: 'u_'+slugify(name), name};
  try{ localStorage.setItem('uaplay_identity', JSON.stringify(me)); }
  catch(e){ /* si no se puede guardar, seguimos igual con la sesión actual */ }

function renderIdentityGate(){
  const app = document.getElementById('app');
  document.getElementById('whoBox').innerHTML = '';
  app.innerHTML = `
    <div class="card" style="max-width:360px;margin:60px auto;">
      <h2>👋 ¿Cómo te llamás?</h2>
      <p class="sub">Solamente verás las acciones creadas bajo tu nombre.</p>

      <button class="cta" id="ideGo" style="width:100%;margin-top:14px;">Entrar</button>
    </div>
  `;
  document.getElementById('ideName').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('ideGo').click(); });
  document.getElementById('ideGo').onclick = async ()=>{
    const v = document.getElementById('ideName').value.trim();

let db = null;
let firebaseReady = false;
async function initFirebase(){
  if(firebaseReady) return true;
  try{
    if(!firebaseConfig || firebaseConfig.apiKey === 'TU_API_KEY'){
      showStorageWarning('⚠️ Falta configurar Firebase (mirá el comentario arriba del todo del archivo).');
      return false;
    }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    await firebase.auth().signInAnonymously();
    firebaseReady = true;
    return true;
  }catch(e){
    showStorageWarning('⚠️ No se pudo conectar con la base de datos. Revisá la config de Firebase.');
    return false;
  }
}

async function loadCampaigns(){
  const ok = await initFirebase();
  if(!ok){ campaigns = []; return; }
  try{
    const snap = await db.collection('campaigns').get();
    campaigns = snap.docs.map(doc=>doc.data());
  }catch(e){ campaigns = []; showStorageWarning('⚠️ No se pudieron cargar las campañas desde la base de datos.'); }
}
function showStorageWarning(msg){
  if(document.getElementById('storageWarning')) return;
  const div = document.createElement('div');
  div.id = 'storageWarning';
  div.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff3cd;color:#8a6100;border:1px solid #ffd98a;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:200;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(()=>{ div.remove(); }, 7000);
}

async function saveCampaigns(){
  const ok = await initFirebase();
  if(!ok) return;
  try{
    const batch = db.batch();
    campaigns.forEach(c=>{ batch.set(db.collection('campaigns').doc(c.id), c); });
    await batch.commit();
  }catch(e){ showStorageWarning('⚠️ No se pudo guardar en la base de datos — probá de nuevo antes de compartir el link.'); }
}
async function deleteCampaignRemote(id){
  const ok = await initFirebase();
  if(!ok) return;
  try{ await db.collection('campaigns').doc(id).delete(); }catch(e){ /* si falla, queda igual en la lista local hasta el próximo intento */ }
}

function toDatetimeLocal(date){
  const pad = n=>String(n).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function customConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="text-align:center;">
        <div style="font-size:40px;margin-bottom:10px;">${opts.icon || '⚠️'}</div>
        <p style="font-size:16px;color:var(--azul-osc);margin:0 0 22px;line-height:1.4;">${message}</p>
        <div style="display:flex;gap:10px;">
          <button class="cta ghost" id="confirmCancelBtn" style="flex:1;">Cancelar</button>
          <button class="cta" id="confirmOkBtn" style="flex:1;background:var(--rosa);">${opts.okLabel || 'Sí, continuar'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cleanup = (val)=>{ overlay.remove(); resolve(val); };
    document.getElementById('confirmCancelBtn').onclick = ()=>cleanup(false);
    document.getElementById('confirmOkBtn').onclick = ()=>cleanup(true);
    overlay.onclick = (e)=>{ if(e.target===overlay) cleanup(false); };
  });
}

      <h2>Paso 1 · Datos generales</h2>
      <p class="step-hint">Esto es lo primero que va a ver quien entre a tu promo.</p>
      <label>Nombre de la campaña</label>
      <input type="text" id="fName" placeholder="Ej: Ruleta de verano LATAM" value="${escapeAttr(d.name)}">

      <label>Tipo de juego</label>
      <p class="step-hint">Elegí cómo va a participar la gente.</p>
      <div class="game-types">
        ${GAME_TYPES.map(g=>`
          <div class="game-type ${d.gameType===g.id?'sel':''}" data-type="${g.id}">
            <span class="emoji">${g.emoji}</span><b>${g.label}</b>
          </div>`).join('')}
      </div>

      ${d.gameType==='roulette' ? `
      <label>Modo de la ruleta</label>
      <div class="mode-toggle">
        <div class="mode-opt ${d.rouletteMode==='prizes'?'sel':''}" data-mode="prizes">🎁 Premios<br><span style="font-weight:400;font-size:11px;">reparte los premios configurados por probabilidad</span></div>
        <div class="mode-opt ${d.rouletteMode==='names'?'sel':''}" data-mode="names">📋 Nombres y apellidos<br><span style="font-weight:400;font-size:11px;">sortea entre una lista de personas que vos cargás</span></div>
      </div>` : ''}

      <label>Ventana activa</label>
      <p class="step-hint">Desde cuándo y hasta cuándo se puede jugar. Pasada la fecha de fin, el link deja de funcionar solo.</p>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><span style="font-size:11px;color:#5b7c8f;">Desde</span><input type="datetime-local" id="fStart" value="${d.startAt}"></div>
        <div style="flex:1;"><span style="font-size:11px;color:#5b7c8f;">Hasta</span><input type="datetime-local" id="fEnd" value="${d.endAt}"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <button type="button" class="add-btn" data-quickstart="now" style="margin-top:0;">▶ Arranca ahora</button>
        <button type="button" class="add-btn" data-quickdur="7" style="margin-top:0;">Dura 7 días</button>
        <button type="button" class="add-btn" data-quickdur="15" style="margin-top:0;">Dura 15 días</button>
        <button type="button" class="add-btn" data-quickdur="30" style="margin-top:0;">Dura 1 mes</button>
      </div>
    </div>

    <div class="card">
      <details>
        <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--azul);">⚙️ Opciones avanzadas (opcional — no hace falta tocar nada acá para publicar)</summary>
        <div style="margin-top:14px;">
          <label>Cupo máximo de participantes</label>
          <p class="step-hint">Si lo dejás vacío, no hay límite — solo se corta por fecha. Útil para controlar el costo si tenés premios con stock ilimitado.</p>
          <input type="number" id="fMaxParticipants" min="1" placeholder="Sin límite" value="${d.maxParticipants??''}">

          <label style="margin-top:16px;">Bases y condiciones</label>
          <p class="step-hint">Si cargás un texto acá, el participante va a tener que aceptarlo con un check antes de jugar. Si lo dejás vacío, no se le pide nada.</p>
          <textarea id="fTerms" placeholder="Ej: Promoción válida del ... al ... Un premio por persona. Universal Assistance se reserva el derecho de...">${escapeHtml(d.termsText)}</textarea>

          <label style="margin-top:16px;">Mensaje cuando gana un premio</label>
          <p class="step-hint">Si no escribís nada, se usa el mensaje predeterminado.</p>
          <textarea id="fWinMsg" placeholder="Guardá este resultado, pronto te contactamos 🎉">${escapeHtml(d.customWinMessage)}</textarea>

          <label style="margin-top:16px;">Mensaje cuando no gana esta vez</label>
          <textarea id="fLoseMsg" placeholder="La próxima promo puede ser la tuya ✈️">${escapeHtml(d.customLoseMessage)}</textarea>
        </div>
      </details>
    </div>

    ${isNamesMode ? `
    <div class="card">
      <h2>Paso 2 · Lista de nombres y apellidos</h2>
      <p class="step-hint">Uno por línea. Cada spin saca a alguien de la lista y no se repite hasta que reinicies el sorteo.</p>
      <textarea id="fNames" placeholder="Juan Pérez&#10;María Gómez&#10;...">${escapeHtml(d.namesList.join('\n'))}</textarea>
    </div>` : `
    <div class="card">
      <h2>Paso 2 · Preguntas para el participante</h2>
      <p class="step-hint">El email siempre se pide (para que cada persona juegue una sola vez). Acá agregás lo demás que quieras saber: nombre, teléfono, sucursal, lo que necesites.</p>
      <div id="questionsList"></div>
      <button class="add-btn" id="addQuestion" ${d.questions.length>=10?'disabled style="opacity:.4;"':''}>+ agregar pregunta${d.questions.length>=10?' (máximo 10)':''}</button>
    </div>

    ${d.gameType==='quiz' ? `
    <div class="card">
      <h2>Paso ${stepQuizQ} · Preguntas del quiz</h2>
      <p class="step-hint">Las preguntas que va a responder la persona antes de conocer el resultado. Podés agregar más de una y hasta 4 opciones por pregunta.</p>
      <label>Tiempo para responder cada pregunta</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="number" id="fQuizTime" min="5" max="30" value="${d.quizTimeLimit}" style="width:90px;">
        <span class="step-hint" style="margin:0;">segundos (mínimo 5, máximo 30)</span>
      </div>
      <div id="quizQuestionsList"></div>
      <button class="add-btn" id="addQuizQuestion" ${d.quizQuestions.length>=10?'disabled style="opacity:.4;"':''}>+ agregar pregunta del quiz${d.quizQuestions.length>=10?' (máximo 10)':''}</button>

      <label style="margin-top:16px;">¿Qué necesita para entrar al sorteo del premio?</label>
      <div class="mode-toggle">
        <div class="mode-opt ${d.quizPassMode!=='count'?'sel':''}" data-passmode="percent">% de preguntas correctas</div>
        <div class="mode-opt ${d.quizPassMode==='count'?'sel':''}" data-passmode="count">Cantidad de preguntas correctas</div>
      </div>
      ${d.quizPassMode==='count'
        ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;"><input type="number" id="fPassCount" min="1" max="${Math.max(1,d.quizQuestions.length)}" value="${d.quizPassCount}" style="width:80px;"><span class="step-hint" style="margin:0;">de ${d.quizQuestions.length} pregunta${d.quizQuestions.length===1?'':'s'} bien respondidas</span></div>`
        : `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;"><input type="number" id="fPassPercent" min="0" max="100" value="${d.quizPassPercent}" style="width:80px;"><span class="step-hint" style="margin:0;">% de aciertos como mínimo</span></div>`}

      <label style="margin-top:16px;">Si aprueba, ¿cómo se define el premio?</label>
      <p class="step-hint">Podés combinarlo con otro juego como paso extra, o hacer el sorteo directo.</p>
      <div class="game-types" style="grid-template-columns:repeat(3,1fr);">
        <div class="game-type ${d.quizFollowGame==='none'?'sel':''}" data-followgame="none">
          <span class="emoji">🎯</span><b>Sorteo directo</b>
        </div>
        <div class="game-type ${d.quizFollowGame==='scratch'?'sel':''}" data-followgame="scratch">
          <span class="emoji">🎟️</span><b>Raspadita</b>
        </div>
        <div class="game-type ${d.quizFollowGame==='roulette'?'sel':''}" data-followgame="roulette">
          <span class="emoji">🎡</span><b>Ruleta</b>
        </div>
      </div>
    </div>` : ''}

    <div class="card">
      <h2>Paso ${stepPremios} · Premios y probabilidades</h2>
      <p class="step-hint">Pensalo como repartir 100 boletos: cada premio se lleva un %, y lo que sobra queda como "seguir participando" (no ganó nada esta vez). No hace falta que hagas la cuenta — se calcula solo abajo.</p>
      <div id="prizesList"></div>
      <button class="add-btn" id="addPrize">+ agregar premio</button>
      <label style="margin-top:16px;">% de "seguir participando" (se calcula solo)</label>
      <div style="padding:10px 12px;background:#f2fbfc;border-radius:10px;font-weight:700;color:var(--azul);">
        ${Math.max(0, 100 - sumPrizes)}%
        ${sumPrizes>100 ? ' <span style="color:var(--rosa);font-weight:600;font-size:12px;">⚠️ los premios ya suman más de 100%, bajá algún %</span>' : ''}
      </div>
      <div class="prob-bar">
        ${d.prizes.map((p,i)=>`<div style="width:${p.probability}%;background:${BRAND_COLORS[i%BRAND_COLORS.length]}"></div>`).join('')}
        <div style="width:${Math.max(0,100-sumPrizes)}%;background:#c7d7de"></div>
      </div>
      <div class="prob-msg ${totalOk?'prob-ok':'prob-bad'}">
        ${totalOk ? '✓ Listo, suma 100%' : `Los premios suman ${sumPrizes}% — no puede pasarse de 100%`}
      </div>
    </div>`}

    <div class="card">
      <h2>Paso ${stepEnvio} · Envío automático de datos</h2>
      <label>¿A qué emails querés que enviemos los datos de los inscriptos cuando finalice la acción?</label>
      <p class="step-hint">Solo se aceptan emails ${NOTIFY_DOMAIN}. Máximo ${MAX_EXTRA_NOTIFY_EMAILS} direcciones.</p>
      <div id="extraEmailsList"></div>
      <button class="add-btn" id="addNotifyEmail" ${d.notifyEmails.length>=MAX_EXTRA_NOTIFY_EMAILS?'disabled style="opacity:.4;"':''}>+ agregar email${d.notifyEmails.length>=MAX_EXTRA_NOTIFY_EMAILS?' (máximo alcanzado)':''}</button>
      <p class="sub" style="margin:8px 0 0;font-size:12px;">Apenas se cumpla la fecha de fin, el sistema arma un archivo con todas las respuestas y lo manda solo, sin que tengas que hacer nada.</p>
    </div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="cta" id="publishBtn" ${(!d.name||!totalOk||!d.startAt||!d.endAt||!namesOk||!quizOk||!notifyOk)?'disabled':''}>${editing ? 'Guardar cambios ✓' : 'Publicar y generar link 🚀'}</button>
      <button class="cta ghost" id="previewBtn" type="button">👀 Probar cómo lo ve el participante</button>
      <span id="savedFlash" style="font-size:13px;color:var(--teal);font-weight:600;"></span>
    </div>
    ${(()=>{
      const missing = [];
      if(!d.name) missing.push('el nombre de la campaña');
      if(!d.startAt || !d.endAt) missing.push('las fechas de inicio y fin');
      if(!notifyOk) missing.push(`que los emails extra sean ${NOTIFY_DOMAIN} (paso ` + (isNamesMode?'3':'4') + ')');
      if(isNamesMode && !namesOk) missing.push('al menos un nombre en la lista');
      if(d.gameType==='quiz' && !quizOk) missing.push('al menos una pregunta del quiz con 2 opciones completas y una marcada como correcta');
      if(!isNamesMode && !totalOk) missing.push(sumPrizes===0 ? 'cargar al menos un premio con % mayor a 0' : 'bajar el % de los premios (no puede superar 100%)');
      return missing.length ? `<p style="color:var(--rosa);font-size:12.5px;font-weight:600;margin-top:8px;">Para poder publicar todavía falta: ${missing.join(', ')}.</p>` : '';
    })()}
  `;

  if(!isNamesMode){ renderQuestions(); renderPrizes(); }
  if(d.gameType==='quiz') renderQuizQuestions();

  document.getElementById('fName').oninput = e=>{d.name=e.target.value; refreshPublishState();};
  document.getElementById('fStart').oninput = e=>{d.startAt=e.target.value; refreshPublishState();};
  document.getElementById('fEnd').oninput = e=>{d.endAt=e.target.value; refreshPublishState();};
  document.querySelector('[data-quickstart]').onclick = ()=>{ d.startAt = toDatetimeLocal(new Date()); renderAdmin(); };
  document.querySelectorAll('[data-quickdur]').forEach(btn=>{
    btn.onclick = ()=>{
      const base = d.startAt ? new Date(d.startAt) : new Date();
      if(!d.startAt) d.startAt = toDatetimeLocal(base);
      const end = new Date(base.getTime() + Number(btn.dataset.quickdur)*24*60*60*1000);
      d.endAt = toDatetimeLocal(end);
      renderAdmin();
    };
  });
  const fNames = document.getElementById('fNames');
  if(fNames) fNames.oninput = e=>{d.namesList = e.target.value.split('\n'); refreshPublishState();};
  document.getElementById('fTerms').oninput = e=>{ d.termsText = e.target.value; };
  document.getElementById('fMaxParticipants').oninput = e=>{ d.maxParticipants = e.target.value==='' ? null : Math.max(1, Number(e.target.value)||1); };
  const fWinMsg = document.getElementById('fWinMsg');
  if(fWinMsg) fWinMsg.oninput = e=>{ d.customWinMessage = e.target.value; };
  const fLoseMsg = document.getElementById('fLoseMsg');
  if(fLoseMsg) fLoseMsg.oninput = e=>{ d.customLoseMessage = e.target.value; };

  document.querySelectorAll('[data-type]').forEach(el=>{ el.onclick = ()=>{ d.gameType = el.dataset.type; renderAdmin(); }; });
  document.querySelectorAll('[data-followgame]').forEach(el=>{ el.onclick = ()=>{ d.quizFollowGame = el.dataset.followgame; renderAdmin(); }; });
  document.querySelectorAll('[data-mode]').forEach(el=>{ el.onclick = ()=>{ d.rouletteMode = el.dataset.mode; renderAdmin(); }; });
  const addQ = document.getElementById('addQuestion');
  if(addQ) addQ.onclick = ()=>{ if(d.questions.length<10) d.questions.push({id:'q'+Date.now(), label:'', type:'text', options:[], required:true}); renderAdmin(); };
  const fQuizTime = document.getElementById('fQuizTime');
  if(fQuizTime) fQuizTime.oninput = e=>{
    let v = Number(e.target.value)||10;
    v = Math.max(5, Math.min(30, v));
    d.quizTimeLimit = v;
    if(Number(e.target.value)!==v) e.target.value = v;
  };
  const addQQ = document.getElementById('addQuizQuestion');
  if(addQQ) addQQ.onclick = ()=>{ if(d.quizQuestions.length<10) d.quizQuestions.push({id:'qq'+Date.now(), text:'', options:[{id:'qo'+Date.now(),text:'',correct:false},{id:'qo'+(Date.now()+1),text:'',correct:false}]}); renderAdmin(); };
  document.querySelectorAll('[data-passmode]').forEach(el=>{
    el.onclick = ()=>{ d.quizPassMode = el.dataset.passmode; renderAdmin(); };
  });
  const fPassCount = document.getElementById('fPassCount');
  if(fPassCount) fPassCount.oninput = e=>{ d.quizPassCount = Math.max(1, Math.min(d.quizQuestions.length||1, Number(e.target.value)||1)); };
  const fPassPercent = document.getElementById('fPassPercent');
  if(fPassPercent) fPassPercent.oninput = e=>{ d.quizPassPercent = Math.max(0, Math.min(100, Number(e.target.value)||0)); };
  const addP = document.getElementById('addPrize');
  if(addP) addP.onclick = ()=>{ d.prizes.push({id:'p'+Date.now(), name:'', probability:0, stock:null}); renderAdmin(); };
  document.getElementById('publishBtn').onclick = editing ? saveEdits : publishCampaign;
  document.getElementById('previewBtn').onclick = startPreview;

  renderExtraEmails();
  document.getElementById('addNotifyEmail').onclick = ()=>{
    if(d.notifyEmails.length<MAX_EXTRA_NOTIFY_EMAILS){ d.notifyEmails.push(''); renderAdmin(); }
  };

  function renderExtraEmails(){
    const box = document.getElementById('extraEmailsList');
    box.innerHTML = d.notifyEmails.map((email,i)=>{
      const valid = !email.trim() || isValidNotifyEmail(email);
      return `
      <div class="row-item">
        <input type="email" placeholder="nombre${NOTIFY_DOMAIN}" value="${escapeAttr(email)}" data-extraemail="${i}" style="flex:1;border-color:${valid?'':'var(--rosa)'};">
        <button class="del" data-delemail="${i}">✕</button>
      </div>
      ${!valid ? `<p style="color:var(--rosa);font-size:11.5px;margin:-4px 0 6px;">Tiene que ser un email ${NOTIFY_DOMAIN}</p>` : ''}`;
    }).join('');
    box.querySelectorAll('[data-extraemail]').forEach(inp=>{
      inp.oninput = e=>{ d.notifyEmails[Number(inp.dataset.extraemail)] = e.target.value; refreshPublishStateExternal(); };
      inp.onblur = renderAdmin;
    });
    box.querySelectorAll('[data-delemail]').forEach(btn=>{
      btn.onclick = ()=>{ d.notifyEmails.splice(Number(btn.dataset.delemail),1); renderAdmin(); };
    });
  }

  function refreshPublishState(){
    formDirty = true;
    const s = d.prizes.reduce((a,p)=>a+(Number(p.probability)||0),0);
    const okPrizes = isNamesMode ? d.namesList.filter(n=>n.trim()).length>0 : (s<=100 && s>0);
    const okQuiz = d.gameType==='quiz' ? d.quizQuestions.some(q=>q.text.trim() && q.options.filter(o=>o.text.trim()).length>=2 && q.options.some(o=>o.correct && o.text.trim())) : true;
    const okNotify = d.notifyEmails.every(e=>!e.trim() || isValidNotifyEmail(e));
    document.getElementById('publishBtn').disabled = !(d.name && d.startAt && d.endAt && okPrizes && okQuiz && okNotify);
  }
}

function renderQuestions(){
  const d = currentDraft;
  const list = document.getElementById('questionsList');
  list.innerHTML = d.questions.map(q=>`
    <div class="row-item" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" placeholder="Texto de la pregunta" value="${escapeAttr(q.label)}" data-qid="${q.id}" style="flex:1;">
        <button class="del" data-delq="${q.id}">✕</button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:12px;margin-top:6px;">
        <input type="checkbox" data-qreq="${q.id}" ${q.required!==false?'checked':''} style="width:auto;"> Obligatoria para poder jugar
      </label>
      <div class="mode-toggle" style="margin-top:8px;">
        <div class="mode-opt ${q.type!=='list'?'sel':''}" data-qtype="${q.id}|text" style="padding:7px;font-size:12px;">✏️ Texto libre</div>
        <div class="mode-opt ${q.type==='list'?'sel':''}" data-qtype="${q.id}|list" style="padding:7px;font-size:12px;">📋 Lista de opciones</div>
      </div>
      ${q.type==='list' ? `
        <div class="mode-toggle" style="margin-top:6px;">
          <div class="mode-opt ${q.selectionMode!=='multiple'?'sel':''}" data-qsel="${q.id}|single" style="padding:6px;font-size:11px;">Elegir una</div>
          <div class="mode-opt ${q.selectionMode==='multiple'?'sel':''}" data-qsel="${q.id}|multiple" style="padding:6px;font-size:11px;">Elegir varias</div>
        </div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
          ${q.options.map(o=>`
            <div style="display:flex;gap:6px;align-items:center;">
              <input type="text" placeholder="Opción" value="${escapeAttr(o.text)}" data-optext="${q.id}|${o.id}" style="flex:1;">
              <button class="del" data-delopt="${q.id}|${o.id}" ${q.options.length<=2?'disabled style="opacity:.3;"':''}>✕</button>
            </div>`).join('')}
          <button type="button" class="add-btn" data-addopt="${q.id}" style="margin-top:0;">+ opción</button>
        </div>` : ''}
    </div>`).join('');

  list.querySelectorAll('[data-qid]').forEach(inp=>{
    inp.oninput = e=>{ d.questions.find(x=>x.id===inp.dataset.qid).label = e.target.value; };
  });
  list.querySelectorAll('[data-qreq]').forEach(cb=>{
    cb.onchange = e=>{ d.questions.find(x=>x.id===cb.dataset.qreq).required = e.target.checked; };
  });
  list.querySelectorAll('[data-delq]').forEach(btn=>{
    btn.onclick = ()=>{ d.questions = d.questions.filter(q=>q.id!==btn.dataset.delq); renderAdmin(); };
  });
  list.querySelectorAll('[data-qtype]').forEach(el=>{
    el.onclick = ()=>{
      const [qid, type] = el.dataset.qtype.split('|');
      const q = d.questions.find(x=>x.id===qid);
      q.type = type;
      if(type==='list' && q.options.length===0){
        q.options = [{id:'o'+Date.now(), text:''}, {id:'o'+(Date.now()+1), text:''}];
        q.selectionMode = q.selectionMode || 'single';
      }
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-qsel]').forEach(el=>{
    el.onclick = ()=>{
      const [qid, mode] = el.dataset.qsel.split('|');
      d.questions.find(x=>x.id===qid).selectionMode = mode;
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-optext]').forEach(inp=>{
    inp.oninput = e=>{
      const [qid, oid] = inp.dataset.optext.split('|');
      d.questions.find(x=>x.id===qid).options.find(o=>o.id===oid).text = e.target.value;
    };
  });
  list.querySelectorAll('[data-delopt]').forEach(btn=>{
    btn.onclick = ()=>{
      const [qid, oid] = btn.dataset.delopt.split('|');
      const q = d.questions.find(x=>x.id===qid);
      if(q.options.length>2) q.options = q.options.filter(o=>o.id!==oid);
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-addopt]').forEach(btn=>{
    btn.onclick = ()=>{
      d.questions.find(x=>x.id===btn.dataset.addopt).options.push({id:'o'+Date.now(), text:''});
      renderAdmin();
    };
  });
}

function refreshPublishStateExternal(){
  formDirty = true;
  const d = currentDraft;
  const btn = document.getElementById('publishBtn');
  if(!d || !btn) return;
  const isNamesMode = d.gameType==='roulette' && d.rouletteMode==='names';
  const s = d.prizes.reduce((a,p)=>a+(Number(p.probability)||0),0);
  const okPrizes = isNamesMode ? d.namesList.filter(n=>n.trim()).length>0 : (s<=100 && s>0);
  const okQuiz = d.gameType==='quiz' ? d.quizQuestions.some(q=>q.text.trim() && q.options.filter(o=>o.text.trim()).length>=2 && q.options.some(o=>o.correct && o.text.trim())) : true;
  const okNotify = d.notifyEmails.every(e=>!e.trim() || isValidNotifyEmail(e));
  btn.disabled = !(d.name && d.startAt && d.endAt && okPrizes && okQuiz && okNotify);
}

function renderQuizQuestions(){
  const d = currentDraft;
  const list = document.getElementById('quizQuestionsList');
  if(!list) return;
  list.innerHTML = d.quizQuestions.map((q,qi)=>`
    <div class="row-item" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" placeholder="Pregunta ${qi+1}" value="${escapeAttr(q.text)}" data-qqtext="${q.id}" style="flex:1;">
        <button class="del" data-delqq="${q.id}">✕</button>
      </div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        <p class="step-hint" style="margin:0 0 2px;">Marcá con el circulito cuál opción es la correcta.</p>
        ${q.options.map(o=>`
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="radio" name="correct-${q.id}" data-correct="${q.id}|${o.id}" ${o.correct?'checked':''} title="Marcar como correcta" style="width:auto;flex-shrink:0;">
            <input type="text" placeholder="Opción" value="${escapeAttr(o.text)}" data-qotext="${q.id}|${o.id}" style="flex:1;">

      </div>

  list.querySelectorAll('[data-correct]').forEach(rb=>{
    rb.onchange = ()=>{
      const [qid, oid] = rb.dataset.correct.split('|');

      q.options.forEach(o=>{ o.correct = (o.id===oid); });
      refreshPublishStateExternal();
    };
  });

  list.querySelectorAll('[data-qqtext]').forEach(inp=>{
    inp.oninput = e=>{ d.quizQuestions.find(x=>x.id===inp.dataset.qqtext).text = e.target.value; refreshPublishStateExternal(); };
  });
  list.querySelectorAll('[data-qotext]').forEach(inp=>{
    inp.oninput = e=>{
      const [qid, oid] = inp.dataset.qotext.split('|');
      d.quizQuestions.find(x=>x.id===qid).options.find(o=>o.id===oid).text = e.target.value;
      refreshPublishStateExternal();
    };
  });
  list.querySelectorAll('[data-delqq]').forEach(btn=>{
    btn.onclick = ()=>{ d.quizQuestions = d.quizQuestions.filter(q=>q.id!==btn.dataset.delqq); renderAdmin(); };
  });
  list.querySelectorAll('[data-delqo]').forEach(btn=>{
    btn.onclick = ()=>{
      const [qid, oid] = btn.dataset.delqo.split('|');
      const q = d.quizQuestions.find(x=>x.id===qid);
      if(q.options.length>2) q.options = q.options.filter(o=>o.id!==oid);
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-addqo]').forEach(btn=>{
    btn.onclick = ()=>{
      const q = d.quizQuestions.find(x=>x.id===btn.dataset.addqo);
      if(q.options.length<4) q.options.push({id:'qo'+Date.now(), text:'', correct:false});
      renderAdmin();
    };
  });
}

async function downloadQr(link, filename){
  const url = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(link)}`;
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = (filename||'qr') + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objUrl);
  }catch(e){
    window.open(url, '_blank');
  }
}

function downloadCsv(campaign){
  const csv = buildParticipantsCsv(campaign);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (campaign.slug||'inscriptos') + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function buildParticipantsCsv(campaign){
  const isNamesMode = campaign.gameType==='roulette' && campaign.rouletteMode==='names';
  if(isNamesMode){
    const lines = ['ganador'];
    campaign.participations.forEach(p=>{ if(p.result?.type==='name') lines.push(p.result.name); });
    return lines.join('\n');
  }
  const headers = ['email', ...campaign.questions.map(q=>q.label), 'resultado'];
  const lines = [headers.join(',')];
  campaign.participations.forEach(p=>{
    const row = [p.answers.__contactEmail||'', ...campaign.questions.map(q=> String(p.answers[q.id]||'').replace(/,/g,';'))];
    const resultLabel = p.result?.type==='prize' ? p.result.prize.name : (p.result?.type==='name' ? p.result.name : 'seguir participando');
    row.push(resultLabel);
    lines.push(row.join(','));
  });
  return lines.join('\n');
}

async function checkAndSendIfDue(campaign){
  if(campaign.notified) return;
  const dateOver = campaign.endAt && new Date(campaign.endAt).getTime() <= Date.now();
  const capReached = campaign.maxParticipants && campaign.participations.length >= campaign.maxParticipants;
  if(!dateOver && !capReached) return;
  await sendParticipantsEmail(campaign);
}

async function sendParticipantsEmail(campaign){
  const cfg = await getEmailjsConfig();
  if(!cfg || !cfg.serviceId || !cfg.templateId || !cfg.publicKey) return;
  const csv = buildParticipantsCsv(campaign);
  const recipients = getFullNotifyList(campaign);
  try{
    let allOk = true;
    for(const to of recipients){
      const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          service_id: cfg.serviceId,
          template_id: cfg.templateId,
          user_id: cfg.publicKey,
          template_params:{
            to_email: to,
            campaign_name: campaign.name,
            participants_count: campaign.participations.length,
            participants_csv: csv
          }
        })
      });
      if(!res.ok) allOk = false;
    }
    if(allOk){ campaign.notified = true; campaign.notifiedAt = Date.now(); await saveCampaigns(); }
  }catch(e){ /* si falla, se reintenta la próxima vez que alguien abra la página */ }
}

function drawPrize(campaign){
  const available = campaign.prizes.filter(p => p.stock === null || p.stock > 0);
  let cumulative = 0;
  const roll = Math.random() * 100;
  for(const p of available){
    cumulative += Number(p.probability);
    if(roll < cumulative){ if(p.stock !== null) p.stock -= 1; return {type:'prize', prize:p}; }
  }
  return {type:'continue'};
}
function drawName(campaign){
  if(!campaign.namesPool) campaign.namesPool = [...campaign.namesList];
  if(campaign.namesPool.length===0) return {type:'empty'};
  const idx = Math.floor(Math.random()*campaign.namesPool.length);
  const winner = campaign.namesPool.splice(idx,1)[0];
  return {type:'name', name:winner, idx};
}

  const previewBanner = isPreview ? `
    <div style="background:#fff7e6;border:1px solid #ffd98a;color:#8a6100;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;max-width:340px;margin:0 auto 14px;">
      👀 MODO PRUEBA — nada de esto se guarda ni se manda
    </div>
    <button class="cta ghost" id="backToEdit" style="margin-bottom:14px;">← Volver a editar</button>` : '';

  if(isNamesMode){
    app.innerHTML = `<div class="public-wrap">${previewBanner}<h1 class="hero">${escapeHtml(campaign.name)}</h1><p class="sub">Girá la ruleta para sortear entre la lista cargada ✨</p><div id="gameZone"></div></div>`;
    document.getElementById('backToEdit')?.addEventListener('click', ()=>{ setChromeVisible(true); renderAdmin(); });
    playGame(campaign, {});
    return;
  }

  const hasTerms = (campaign.termsText||'').trim().length>0;

  app.innerHTML = `
    <div class="public-wrap">
      ${previewBanner}
      <h1 class="hero">${escapeHtml(campaign.name)}</h1>
      <p class="sub" id="preGameSub">Completá tus datos y probá tu suerte ✨</p>
      <div class="card" style="width:100%;max-width:340px;text-align:left;" id="formCard">
        <div class="field-question">
          <label>Tu email *</label>
          <input type="email" id="contactEmail" placeholder="tumail@ejemplo.com">
        </div>
        ${campaign.questions.map(q=>{
          const reqMark = q.required!==false ? ' *' : '';
          if(q.type==='list'){
            const opts = (q.options||[]).filter(o=>o.text.trim());
            const inputType = q.selectionMode==='multiple' ? 'checkbox' : 'radio';
            return `<div class="field-question">
              <label>${escapeHtml(q.label)}${reqMark}</label>
              ${opts.map(o=>`
                <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;margin:6px 0;">
                  <input type="${inputType}" name="qopt-${q.id}" value="${escapeAttr(o.text)}" style="width:auto;">
                  ${escapeHtml(o.text)}
                </label>`).join('')}
            </div>`;
          }
          return `<div class="field-question"><label>${escapeHtml(q.label)}${reqMark}</label><input type="text" data-answer="${q.id}"></div>`;
        }).join('')}
        ${hasTerms ? `
        <details style="margin-bottom:10px;">
          <summary style="cursor:pointer;font-size:12px;color:var(--azul);">Ver bases y condiciones</summary>
          <p style="font-size:12px;color:#4a6b80;white-space:pre-wrap;">${escapeHtml(campaign.termsText)}</p>
        </details>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;">
          <input type="checkbox" id="acceptTerms" style="width:auto;"> Acepto las bases y condiciones
        </label>` : ''}
        <div id="formError" style="color:var(--rosa);font-size:13px;font-weight:600;margin:6px 0;"></div>
        <button class="cta invite" id="goPlay" style="width:100%;margin-top:4px;">Jugar</button>
      </div>
      <div id="gameZone"></div>
    </div>
  `;
  document.getElementById('backToEdit')?.addEventListener('click', ()=>{ setChromeVisible(true); renderAdmin(); });
  document.getElementById('goPlay').onclick = ()=>{
    sound.click();
    const email = document.getElementById('contactEmail').value.trim().toLowerCase();
    const errBox = document.getElementById('formError');
    if(!email || !email.includes('@')){ errBox.textContent = 'Ingresá un email válido.'; return; }
    if(!isPreview){
      const already = campaign.participations.some(p => (p.answers?.__contactEmail||'').toLowerCase() === email);
      if(already){ errBox.textContent = 'Ya participaste con este email — cada persona puede jugar una sola vez.'; return; }
    }
    if(hasTerms && !document.getElementById('acceptTerms').checked){ errBox.textContent = 'Tenés que aceptar las bases y condiciones para jugar.'; return; }

    for(const q of campaign.questions){
      if(q.required===false) continue;
      if(q.type==='list'){
        const anyChecked = document.querySelector(`input[name="qopt-${q.id}"]:checked`);
        if(!anyChecked){ errBox.textContent = `Tenés que responder: "${q.label}"`; return; }
      } else {
        const val = document.querySelector(`[data-answer="${q.id}"]`).value.trim();
        if(!val){ errBox.textContent = `Completá: "${q.label}"`; return; }
      }
    }

    const answers = { __contactEmail: email };
    campaign.questions.forEach(q=>{
      if(q.type==='list'){
        if(q.selectionMode==='multiple'){
          const chosen = Array.from(document.querySelectorAll(`input[name="qopt-${q.id}"]:checked`)).map(el=>el.value);
          answers[q.id] = chosen.join('; ');
        } else {
          const sel = document.querySelector(`input[name="qopt-${q.id}"]:checked`);
          answers[q.id] = sel ? sel.value : '';
        }
      } else {
        answers[q.id] = document.querySelector(`[data-answer="${q.id}"]`).value;
      }
    });
    document.getElementById('formCard').style.display='none';
    const preSub = document.getElementById('preGameSub');
    if(preSub){
      const msgs = { roulette:'¡Girá y probá tu suerte! 🍀', scratch:'¡Raspá y descubrí tu premio! 🍀', quiz:'¡Respondé y descubrí tu resultado! 🍀' };
      preSub.textContent = msgs[campaign.gameType] || '¡Probá tu suerte! 🍀';
    }
    playGame(campaign, answers);
  };
}

function playGame(campaign, answers){
  const zone = document.getElementById('gameZone');
  if(campaign.gameType==='roulette') renderRoulette(zone, campaign, answers);
  else if(campaign.gameType==='scratch') renderScratch(zone, campaign, answers);
  else renderQuiz(zone, campaign, answers);
}
function finishParticipation(campaign, answers, result){
  if(campaign.__isPreview) return;
  campaign.participations.push({answers, result, at: Date.now()});
  saveCampaigns();
}
function showResult(zone, result, campaign){
  const winMsg = (campaign?.customWinMessage||'').trim() || 'Guardá este resultado, pronto te contactamos 🎉';
  const loseMsg = (campaign?.customLoseMessage||'').trim() || 'La próxima promo puede ser la tuya ✈️';

  let tag, title, body;
  if(result.type==='prize'){ tag='¡GANASTE!'; title=result.prize.name; body=winMsg; }
  else if(result.type==='name'){ tag='GANADOR/A'; title=result.name; body=winMsg; }
  else if(result.type==='empty'){ tag='Sorteo'; title='Ya salieron todos'; body='Reiniciá el sorteo desde el panel para volver a girar.'; }
  else { tag='Por esta vez'; title='Seguí participando'; body=loseMsg; }

  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  overlay.innerHTML = `
    <div class="result-big">
      <div class="result-tag">${escapeHtml(tag)}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(body)}</p>
      <button class="cta" id="closeResultBtn">Cerrar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  if(result.type==='prize' || result.type==='name') sound.win();
  else if(result.type==='continue') sound.lose();
  document.getElementById('closeResultBtn').onclick = ()=> overlay.remove();
  if(result.type==='prize' || result.type==='name') launchConfetti();
}

function renderRoulette(zone, campaign, answers){
  const isNamesMode = campaign.gameType==='roulette' && campaign.rouletteMode==='names';
  const pool = isNamesMode ? (campaign.namesPool || [...campaign.namesList]) : null;
  const segments = isNamesMode
    ? pool.map(n=>({label:n}))
    : [...campaign.prizes.map(p=>({label:p.name||'Premio'})), {label:'Seguí participando', color:'#c7d7de'}];

  if(isNamesMode && segments.length===0){
    zone.innerHTML = `<div class="result"><h3>Sin candidatos</h3><div style="font-size:13px;">Ya se sorteó a todos. Reiniciá desde el panel.</div></div>`;
    return;
  }

  zone.innerHTML = `<div class="stage" id="stage"><div class="pointer"></div><canvas id="wheel" width="400" height="400"></canvas></div><button class="cta invite" id="spinBtn" style="font-size:17px;padding:16px 30px;">Girar la ruleta</button>`;
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const n = segments.length;
  const anglePer = (2*Math.PI)/n;

  function draw(rotation){
    ctx.clearRect(0,0,400,400);
    ctx.save(); ctx.translate(200,200); ctx.rotate(rotation);
    for(let i=0;i<n;i++){
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,190,i*anglePer,(i+1)*anglePer); ctx.closePath();
      ctx.fillStyle = segments[i].color || BRAND_COLORS[i%BRAND_COLORS.length];
      ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
      ctx.save(); ctx.rotate(i*anglePer + anglePer/2); ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='800 16px Poppins';
      ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=3;
      ctx.fillText(String(segments[i].label).slice(0,20), 172, 6);
      ctx.shadowBlur=0;
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,42,0,2*Math.PI); ctx.fillStyle = '#002447'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='700 19px Bebas Neue'; ctx.textAlign='center'; ctx.fillText('ua',0,7);
    ctx.restore();
  }
  draw(0);

  document.getElementById('spinBtn').onclick = ()=>{
    sound.click();
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('spinBtn').classList.remove('invite');
    const stageElStart = document.getElementById('stage');
    stageElStart.style.animation = 'none';
    stageElStart.style.transition = 'transform .4s ease';
    stageElStart.style.transform = 'scale(1.12)';
    const pointerEl = document.querySelector('#stage .pointer');
    if(pointerEl) pointerEl.style.animation = 'none';
    const result = isNamesMode ? drawName(campaign) : drawPrize(campaign);
    let idx;
    if(isNamesMode) idx = result.idx;
    else idx = result.type==='prize' ? campaign.prizes.findIndex(p=>p.id===result.prize.id) : segments.length-1;
    const pointerAngle = 3*Math.PI/2; // el puntero está arriba (12 en punto), no a la derecha
    const targetAngle = pointerAngle - (idx*anglePer + anglePer/2);
    const spins = 5*2*Math.PI;
    const total = spins + targetAngle;
    const duration = 3200;
    const start = performance.now();
    let lastSegment = -1;
    function animate(t){
      const p = Math.min(1,(t-start)/duration);
      const ease = 1 - Math.pow(1-p,3);
      const rotation = ease*total;
      draw(rotation);
      const currentSegment = Math.floor(((rotation % (2*Math.PI)) / anglePer));
      if(currentSegment !== lastSegment){ sound.tick(); lastSegment = currentSegment; }
      if(p<1) requestAnimationFrame(animate);
      else{
        const stageEl = document.getElementById('stage');
        stageEl.style.transform = 'scale(1)';
        setTimeout(()=>{
          stageEl.style.transition = '';
          stageEl.style.animation = '';
          stageEl.classList.add('land');
        }, 400);
        finishParticipation(campaign, answers, result);
        showResult(zone, result, campaign);
      }
    }
    requestAnimationFrame(animate);
  };
}

function renderScratch(zone, campaign, answers){
  const result = drawPrize(campaign);
  zone.innerHTML = `
    <div class="scratch-wrap">
      <div class="scratch-under">${result.type==='prize' ? '🎁 '+escapeHtml(result.prize.name) : '✈️ Seguí participando'}</div>
      <canvas id="scratchCanvas" width="340" height="210"></canvas>
    </div>
    <p class="sub">Pasá el dedo o el mouse para raspar</p>
  `;
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,340,210);
  grad.addColorStop(0,'#00C4DF'); grad.addColorStop(1,'#00528F');
  ctx.fillStyle = grad; ctx.fillRect(0,0,340,210);
  ctx.fillStyle='#fff'; ctx.font='700 16px Poppins'; ctx.textAlign='center'; ctx.fillText('RASPÁ ACÁ ✦', 170, 108);

  let drawing=false, revealed=0, done=false, checkCounter=0;
  function pos(e){ const r = canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:cx,y:cy}; }
  const wrap = canvas.closest('.scratch-wrap');
  function scratchedPercent(){
    const data = ctx.getImageData(0,0,340,210).data;
    let cleared = 0, total = 0;
    for(let i=3; i<data.length; i+=4*8){
      total++;
      if(data[i]===0) cleared++;
    }
    return total ? (cleared/total)*100 : 0;
  }
  function scratch(e){
    const {x,y} = pos(e);
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(x,y,20,0,2*Math.PI); ctx.fill();
    revealed++;
    if(revealed%4===0){
      sound.scratch();
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = '✨';
      s.style.left = x+'px'; s.style.top = y+'px';
      wrap.appendChild(s);
      setTimeout(()=>s.remove(), 700);
    }
    checkCounter++;
    if(checkCounter%3===0 && !done && scratchedPercent()>=40){
      done = true;
      canvas.style.animation='none';
      wrap.style.animation='none';
      finishParticipation(campaign, answers, result);
      setTimeout(()=>{ ctx.clearRect(0,0,340,210); showResult(zone, result, campaign); },300);
    }
  }
  canvas.addEventListener('mousedown', e=>{drawing=true; scratch(e);});
  canvas.addEventListener('mousemove', e=>{if(drawing) scratch(e);});
  window.addEventListener('mouseup', ()=>drawing=false);
  canvas.addEventListener('touchstart', e=>{drawing=true; scratch(e);});
  canvas.addEventListener('touchmove', e=>{scratch(e); e.preventDefault();}, {passive:false});
  canvas.addEventListener('touchend', ()=>drawing=false);
}

function renderQuiz(zone, campaign, answers){
  let questions = (campaign.quizQuestions||[]).filter(q=>q.text.trim() && q.options.filter(o=>o.text.trim()).length>=2);
  if(questions.length===0){
    questions = [{id:'demo', text:'¿Cuál de estos destinos protege Universal Assistance?', options:[
      {id:'o1', text:'Todos los destinos del mundo', correct:true}, {id:'o2', text:'Solo Argentina', correct:false}, {id:'o3', text:'Solo playas', correct:false}
    ]}];
  }
  const timeLimit = Math.max(5, Math.min(30, Number(campaign.quizTimeLimit)||10));
  let qIndex = 0;
  let timerInterval = null;
  let correctCount = 0;

  function goNext(){
    clearInterval(timerInterval);
    qIndex++;
    if(qIndex < questions.length){ showQuestion(); return; }
    zone.innerHTML = `<div class="spinner"></div><p class="sub">Calculando tu resultado...</p>`;
    setTimeout(()=>{
      zone.innerHTML = '';
      let eligible;
      if(campaign.quizPassMode==='count'){
        eligible = correctCount >= (Number(campaign.quizPassCount)||1);
      } else {
        const pct = questions.length ? (correctCount/questions.length*100) : 0;
        eligible = pct >= (campaign.quizPassPercent===undefined?100:Number(campaign.quizPassPercent));
      }
      if(!eligible){
        const result = {type:'continue'};
        finishParticipation(campaign, answers, result);
        showResult(zone, result, campaign);
        return;
      }
      if(campaign.quizFollowGame==='scratch' || campaign.quizFollowGame==='roulette'){
        zone.innerHTML = `<p class="sub" style="text-align:center;">¡Bien! Ahora probá tu premio 🎉</p>`;
        setTimeout(()=>{
          if(campaign.quizFollowGame==='scratch') renderScratch(zone, campaign, answers);
          else renderRoulette(zone, campaign, answers);
        }, 800);
        return;
      }
      const result = drawPrize(campaign);
      finishParticipation(campaign, answers, result);
      showResult(zone, result, campaign);
    }, 900);
  }

  function showQuestion(){
    const q = questions[qIndex];
    const opts = q.options.filter(o=>o.text.trim());
    zone.innerHTML = `
      <div class="card quiz-card">
        ${questions.length>1 ? `<div class="step-hint" style="text-align:center;">Pregunta ${qIndex+1} de ${questions.length}</div>` : ''}
        <div class="quiz-timer-wrap"><div class="quiz-timer-bar" id="quizTimerBar"></div></div>
        <div class="quiz-emoji">❓</div>
        <h2 class="quiz-question">${escapeHtml(q.text)}</h2>
        ${opts.map(o=>`<button class="cta ghost quiz-btn" style="width:100%;margin-bottom:10px;" data-opt="${o.id}" data-correctopt="${o.correct?'1':'0'}">${escapeHtml(o.text)}</button>`).join('')}
      </div>
    `;
    const bar = document.getElementById('quizTimerBar');
    let remaining = timeLimit;
    bar.style.transition = `width ${timeLimit}s linear`;
    requestAnimationFrame(()=>{ bar.style.width = '0%'; });
    timerInterval = setInterval(()=>{
      remaining--;
      if(remaining<=0){
        clearInterval(timerInterval);
        zone.querySelectorAll('[data-opt]').forEach(b=>{ b.disabled=true; if(b.dataset.correctopt==='1') b.classList.add('correct'); });
        sound.lose();
        setTimeout(goNext, 900);
      }
    }, 1000);

    zone.querySelectorAll('[data-opt]').forEach(btn=>{
      btn.onclick = ()=>{
        clearInterval(timerInterval);
        const isCorrect = btn.dataset.correctopt==='1';
        if(isCorrect) correctCount++;
        zone.querySelectorAll('[data-opt]').forEach(b=>{
          b.disabled = true;
          if(b.dataset.correctopt==='1') b.classList.add('correct');
          else if(b===btn) b.classList.add('wrong');
        });
        sound.click();
        setTimeout(goNext, 700);
      };
    });
  }
  showQuestion();
}

function launchConfetti(){
  const c = document.getElementById('confetti');
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  const particles = Array.from({length:120},()=>({
    x: Math.random()*c.width, y:-20-Math.random()*200, r: 4+Math.random()*5,
    color: BRAND_COLORS[Math.floor(Math.random()*BRAND_COLORS.length)],
    vy: 2+Math.random()*3, vx: -1+Math.random()*2, rot: Math.random()*360
  }));
  let frame=0;
  function tick(){
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=5;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    frame++;
    if(frame<140) requestAnimationFrame(tick); else ctx.clearRect(0,0,c.width,c.height);
  }
  tick();
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

async function boot(){
  await loadIdentity();
  await loadCampaigns();
  if(me) currentDraft = newDraft();
  route();
  const hash = location.hash;
  const isPublicRoute = hash.startsWith('#/play/') || hash.startsWith('#/edit/');
  if(me && !isPublicRoute) openHelp();
}
boot();
